[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybridga"
version = "0.1.0"
description = "SGA + nature-inspired features on CEC 2022, CEC 2020 real-world and TSPLIB"
requires-python = ">=3.9"
dependencies = [
    "deap",
    "opfunu",
    "scipy",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "seaborn",
    "scikit-posthocs",
    "statsmodels",
    "cloudpickle",
    "setuptools<81",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
